const KEY='hausmeister-deutsch6-v1';
const app=document.getElementById('app');
let state={page:0,done:0,hiddenCopy:false,bonus:0,answers:{},tries:{},feedback:{},openReading:{},finished:false};
try{const saved=JSON.parse(sessionStorage.getItem(KEY));if(saved&&Number.isInteger(saved.page)&&saved.page>=0&&saved.page<DATA.pages.length)state={...state,...saved};}catch(e){}
function save(){try{sessionStorage.setItem(KEY,JSON.stringify(state));}catch(e){/* In-memory state remains usable if browser storage is unavailable. */}}
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function norm(s){return String(s).normalize('NFC').replace(/\r/g,'').replace(/\s+/g,' ').replace(/\s*([,.;:!?])\s*/g,'$1 ').trim();}
function shortNorm(s){return norm(s).toLocaleLowerCase('de').replace(/[.!?]$/,'').trim();}
function idFor(i){return state.page+'_'+i;}
function valueFor(k,q){return state.answers[k]??((q.type==='text')?q.initial:((q.type==='group'||q.type==='parts')?{}:q.type==='commas'?[]:''));}
function correct(q,v){
 if(q.type==='choice'||q.type==='select')return v!==''&&v!==undefined&&Number(v)===q.answer;
 if(q.type==='text'){if(q.aliases?.length)return[q.answer,...q.aliases].some(a=>shortNorm(v)===shortNorm(a));return norm(v)===norm(q.answer);}
 if(q.type==='parts')return q.parts.every((p,i)=>[p.answer,...(p.aliases||[])].some(a=>shortNorm(v?.[i]??'')===shortNorm(a)));
 if(q.type==='group')return q.items.every((item,i)=>correct(item,v?.[i]));
 if(q.type==='commas')return norm(q.initial.split(' ').map((w,i)=>w+(v?.includes(i)?',':'')).join(' '))===norm(q.answer);
 return false;
}
function attempted(q,v,k){return Boolean(state.tries[k]);}
function tally(){const p=DATA.pages[state.page];return p.questions.filter((q,i)=>correct(q,valueFor(idFor(i),q))&&state.feedback[idFor(i)]?.good).length;}
function ready(){const p=DATA.pages[state.page];return !p.questions.length||(tally()>=(p.threshold??p.questions.length)&&(!p.threshold||p.questions.every((q,i)=>attempted(q,valueFor(idFor(i),q),idFor(i)))));}
function updateHeader(){document.getElementById('code').textContent='🔐 '+DATA.code.split('').map((d,i)=>i<state.done?d:'?').join(' – ');document.getElementById('progressText').textContent=state.done+' von 6 Etappen geschafft';document.getElementById('fill').style.width=(state.done/6*100)+'%';document.querySelector('[role=progressbar]').setAttribute('aria-valuenow',state.done);document.getElementById('steps').innerHTML=Array.from({length:6},(_,i)=>`<span class="step ${i<state.done?'done':DATA.pages[state.page].stage===i+1?'current':''}">${i<state.done?'✓ ':''}Etappe ${i+1}</span>`).join('');}
function inputHTML(q,k,v){
 if(q.type==='choice')return q.options.map((o,i)=>`<label class="choice"><input type="radio" name="${k}" data-key="${k}" value="${i}" ${String(v)===String(i)?'checked':''}><span>${escapeHTML(o)}</span></label>`).join('');
 if(q.type==='select')return `<select id="input_${k}" data-key="${k}" aria-label="${escapeHTML(q.title)}"><option value="">Bitte auswählen</option>${q.options.map((o,i)=>`<option value="${i}" ${String(v)===String(i)?'selected':''}>${escapeHTML(o)}</option>`).join('')}</select>`;
 if(q.type==='text')return `<label class="text-label" for="input_${k}">${q.initial?'Bearbeite den Text direkt im Feld.':'Deine Antwort'}</label>${q.initial?`<textarea id="input_${k}" data-key="${k}" class="${q.initial.length>600?'long':''}" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off">${escapeHTML(v)}</textarea>`:`<input type="text" id="input_${k}" data-key="${k}" value="${escapeHTML(v)}" spellcheck="false" autocomplete="off">`}`;
 if(q.type==='commas')return `<p style="font-size:14px">Tippe zwischen den Wörtern, um ein Komma zu setzen oder zu entfernen.</p><div class="comma-line">${q.initial.split(' ').map((w,i,a)=>`${escapeHTML(w)}${i<a.length-1?`<button type="button" class="comma" data-comma="${i}" data-key="${k}" aria-label="Komma nach ${escapeHTML(w)}" aria-pressed="${v.includes(i)}">${v.includes(i)?',':'·'}</button>`:''} `).join('')}</div>`;
 if(q.type==='parts')return q.parts.map((part,i)=>`<label class="text-label" for="input_${k}_${i}">${escapeHTML(part.label)}</label><input type="text" id="input_${k}_${i}" data-key="${k}" data-part="${i}" value="${escapeHTML(v[i]??'')}" spellcheck="false" autocomplete="off">`).join('');
 if(q.type==='group')return q.items.map((item,i)=>`<div class="group-item"><div class="group-title">${escapeHTML(item.title)}</div>${inputHTML(item,k+'_'+i,v[i]??'').replaceAll(`data-key="${k}_${i}"`,`data-key="${k}" data-part="${i}"`)}<div id="partFeedback_${k}_${i}" class="feedback ${v[i]===undefined||v[i]===''?'':correct(item,v[i])?'good':'bad'}" role="status">${v[i]===undefined||v[i]===''?'':correct(item,v[i])?'✓ Richtig.':'Noch nicht richtig.\n'+(q.hints?.[0]||'Prüfe deine Antwort noch einmal sorgfältig.')}</div></div>`).join('');
 return '';
}
function showFeedback(k,q){const box=document.getElementById('feedback_'+k);const f=state.feedback[k];box.textContent=f?.text??'';box.className='feedback '+(f?.good?'good':f?'bad':'');const parent=document.getElementById('task_'+k);parent?.classList.toggle('passed',Boolean(f?.good));}
function answerHint(q){if(q.type==='choice'||q.type==='select')return q.options[q.answer];if(q.type==='text'||q.type==='commas')return q.answer;if(q.type==='parts')return q.parts.map(p=>p.label+': '+p.answer).join('\n');if(q.type==='group')return q.items.map(item=>item.title+' → '+answerHint(item)).join('\n');return '';}
function check(i){const p=DATA.pages[state.page],q=p.questions[i],k=idFor(i),v=valueFor(k,q);const good=correct(q,v);state.tries[k]=(state.tries[k]||0)+1;const hints=[...(q.hints?.length?q.hints:['Prüfe deine Antwort noch einmal sorgfältig.']),'Lösung zum Vergleichen:\n'+answerHint(q)];state.feedback[k]={good,text:good?'✓ Richtig.'+(q.correctMessage?' '+q.correctMessage:''):'Noch nicht richtig.\n'+hints[Math.min(state.tries[k]-1,hints.length-1)]};save();showFeedback(k,q);updateNext();}
function updateNext(){const p=DATA.pages[state.page];document.getElementById('next').disabled=!ready();const status=document.getElementById('taskStatus');if(status)status.textContent=tally()+' von '+p.questions.length+' richtig'+(p.threshold?' · mindestens '+p.threshold+' von '+p.questions.length+' erforderlich':'');}
function render(focus=false){
 while(DATA.pages[state.page].success&&state.done>=DATA.pages[state.page].stage){state.page++;save();}
 if(state.hiddenCopy&&DATA.pages[state.page].reading?.copy){state.page++;save();}
 const p=DATA.pages[state.page];updateHeader();
 if(state.finished){app.innerHTML=`<div class="eyebrow">Freiwilliger Bonus</div><h1>⭐ Bonus: 3 von 3 geschafft</h1><div class="success">${escapeHTML(DATA.bonusEnd)}</div>`;return;}
 let out=`<div class="eyebrow">${p.stage===0?'Die Prüfung beginnt':p.stage<=6?'Etappe '+p.stage+' von 6':p.stage===7?'Geschafft': 'Freiwilliger Bonus'}</div><h1 tabindex="-1">${escapeHTML(p.title)}</h1>`;
 if(p.stage>=8)out+=`<div class="status" id="bonusProgress">⭐ Bonus: ${state.bonus} von 3 geschafft</div>`;
 if(p.intro)out+=`<div class="story">${p.stage===0?'<span class="ghost" aria-hidden="true">👻</span>':''}${escapeHTML(p.intro)}</div>`;
 if(p.reading){const r=p.reading;out+=r.copy?`<section class="reading" id="copyText"><h2>${escapeHTML(r.title)}</h2><p>${escapeHTML(r.text)}</p></section><div class="story">${escapeHTML(DATA.copyWarning)}</div>`:`<details class="reading" id="reading" ${state.openReading[state.page]??true?'open':''}><summary>${escapeHTML(r.title)}</summary><p>${escapeHTML(r.text)}</p></details>`;}
 out+=p.questions.map((q,i)=>{const k=idFor(i);return `<section class="task" id="task_${k}" aria-labelledby="title_${k}"><h3 id="title_${k}">${escapeHTML(q.title)}</h3>${inputHTML(q,k,valueFor(k,q))}${['text','parts','commas','group'].includes(q.type)?`<div class="actions"><button type="button" class="btn secondary" data-check="${i}">Antwort prüfen</button></div>`:''}<div class="feedback" id="feedback_${k}" role="status" aria-live="polite"></div></section>`;}).join('');
 if(p.stage===7)out+='<div class="chest" aria-hidden="true">🔐</div><div class="code-final">472953</div>';
 const label=p.stage===0?'ETAPPE 1 STARTEN':p.reading?.copy?'WEITER':p.stage===7?'BONUSBEREICH ÖFFNEN':p.success?'ETAPPE ABSCHLIESSEN':p.stage===10?'BONUS ABSCHLIESSEN':'WEITER';
 out+=`<div id="success"></div><div class="footer"><button type="button" id="next" class="btn next">${label}</button>${p.questions.length?'<div class="status" id="taskStatus" aria-live="polite"></div>':''}</div><footer>Deutschheft · eigene Antworten · sechs Etappen</footer>`;
 app.innerHTML=out;
 p.questions.forEach((q,i)=>showFeedback(idFor(i),q));
 const reading=document.getElementById('reading');if(reading)reading.addEventListener('toggle',()=>{state.openReading[state.page]=reading.open;save();});
 app.querySelectorAll('[data-key]').forEach(el=>{
   if(el.hasAttribute('data-comma')){el.addEventListener('click',()=>{const k=el.dataset.key;let v=[...valueFor(k,p.questions[Number(k.split('_')[1])])];const i=Number(el.dataset.comma);v=v.includes(i)?v.filter(x=>x!==i):[...v,i];state.answers[k]=v;delete state.feedback[k];el.setAttribute('aria-pressed',v.includes(i));el.textContent=v.includes(i)?',':'·';save();showFeedback(k,p.questions[Number(k.split('_')[1])]);updateNext();});return;}
   const event=el.tagName==='SELECT'||el.type==='radio'?'change':'input';
   el.addEventListener(event,()=>{const k=el.dataset.key,i=Number(k.split('_')[1]),q=p.questions[i];if(el.hasAttribute('data-part')){state.answers[k]={...valueFor(k,q),[el.dataset.part]:el.value};}else state.answers[k]=el.value;
     if(el.type==='radio'||el.tagName==='SELECT'){
       if(q.type==='group'){const j=Number(el.dataset.part),f=document.getElementById('partFeedback_'+k+'_'+j),good=correct(q.items[j],el.value);f.textContent=good?'✓ Richtig.':'Noch nicht richtig.\n'+(q.hints?.[0]||'Prüfe deine Antwort noch einmal sorgfältig.');f.className='feedback '+(good?'good':'bad');}
       if(q.type==='group'&&!q.items.every((_,j)=>state.answers[k]?.[j]!==undefined&&state.answers[k]?.[j]!=='')){delete state.feedback[k];save();showFeedback(k,q);updateNext();}else check(i);
     }else{delete state.feedback[k];save();showFeedback(k,q);updateNext();}
   });
 });
 app.querySelectorAll('[data-check]').forEach(b=>b.addEventListener('click',()=>check(Number(b.dataset.check))));
 document.getElementById('next').addEventListener('click',next);updateNext();if(focus){app.querySelector('h1').focus({preventScroll:true});window.scrollTo({top:0,behavior:'instant'});}
}
function next(){
 if(!ready())return;
 const p=DATA.pages[state.page];
 if(p.success){state.done=Math.max(state.done,p.stage);save();updateHeader();document.getElementById('success').innerHTML=`<div class="success" role="status">${escapeHTML(p.success)}</div>`;document.getElementById('next').remove();app.querySelectorAll('input,textarea,select,button[data-check],button[data-comma]').forEach(el=>el.disabled=true);const b=document.createElement('button');b.type='button';b.className='btn next';b.id='continue';b.textContent=p.stage===6?'ZUR KASSETTE':'ETAPPE '+(p.stage+1)+' STARTEN';b.addEventListener('click',advance);document.querySelector('.footer').prepend(b);b.focus({preventScroll:true});document.getElementById('success').scrollIntoView({block:'center',behavior:'smooth'});return;}
 if(p.reading?.copy){state.hiddenCopy=true;save();document.getElementById('copyText').remove();}
 if(p.stage>=8)state.bonus=Math.max(state.bonus,p.stage-7);
 if(state.page===DATA.pages.length-1){state.finished=true;save();render();window.scrollTo({top:0,behavior:'instant'});return;}
 advance();
}
function advance(){const p=DATA.pages[state.page];if(p.success&&state.done<p.stage)return;state.page++;save();render(true);}
window.addEventListener('pageshow',()=>{try{const latest=JSON.parse(sessionStorage.getItem(KEY));if(latest)state={...state,...latest};}catch(e){}render();});
render();
</script></body></html>
